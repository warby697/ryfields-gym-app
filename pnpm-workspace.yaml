packages:
  - functions

# Flat node_modules (like npm) so Netlify's function bundler can trace and
# include firebase-admin — pnpm's default symlinked store isn't followed.
nodeLinker: hoisted

overrides:
  # firebase-admin -> jwks-rsa pulls ESM-only jose@6, which the Netlify
  # (Lambda) runtime can't require(). Pin to v5 (CJS build; same importJWK/exportSPKI API).
  jose: ^5

allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  esbuild: true
  netlify-cli: true
  protobufjs: true
  re2: set this to true or false
  sharp: true
  unix-dgram: true
