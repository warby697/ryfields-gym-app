[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # firebase-admin pulls in ESM-only jose via jwks-rsa; bundling it to CJS breaks require().
  # Leaving it external loads it from node_modules at runtime where require(ESM) works.
  external_node_modules = ["firebase-admin"]

[dev]
  command = "npx --no-install vite --port 5173"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/share/event/*"
  to = "/.netlify/functions/event-share?id=:splat"
  status = 200

[[redirects]]
  from = "/share/event-image/*"
  to = "/.netlify/functions/event-image?id=:splat"
  status = 200

[[redirects]]
  from = "/share/class/*"
  to = "/.netlify/functions/class-share?id=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
